<!DOCTYPE html>
<html lang="cs" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slepá ulička | DarkDash</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
        
        body {
            /* Temné radiální pozadí */
            background: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }
        
        .brand-font { font-family: 'Cinzel', serif; }
        
        .error-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 4rem 3rem;
            border: 1px solid #9d4edd;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.2);
            backdrop-filter: blur(10px);
            max-width: 500px;
        }
        
        .error-code {
            font-size: 7rem;
            font-weight: bold;
            color: #dc3545;
            text-shadow: 0 0 20px rgba(220, 53, 69, 0.6);
            margin-bottom: 0;
            line-height: 1;
        }
    </style>
</head>
<body>
    
    <div class="error-container">
        <h1 class="error-code brand-font">404</h1>
        <h3 class="brand-font text-warning mb-4 mt-3">Zabloudil jsi v temnotě</h3>
        
        <p class="text-muted mb-5">
            Tato stezka nikam nevede. Stránka, kterou hledáš, byla pohlcena prázdnotou, nebo dost možná nikdy neexistovala.
        </p>
        
        <a href="/" class="btn btn-outline-info btn-lg brand-font w-100 shadow-sm">
            <i class="fas fa-arrow-left me-2"></i> Zpět do bezpečí
        </a>
    </div>

</body>
</html>
